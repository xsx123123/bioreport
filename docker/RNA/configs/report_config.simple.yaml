# RNA-seq 报告统一配置文件（精简版示例）
# 隐藏 Workflow 与 AI 解读章节，适合快速查看结果

report:
  type: rna-seq
  title: "BFP RNA-seq 精简分析报告"
  subtitle: "RNA 转录组测序分析精简报告"
  language: zh
  output_format: html
  sections:
    - index
    - qc
    - results
    - about
  theme:
    light: ./theme/New_Brutalism.scss
    dark: ./theme/Dark_New_Brutalism.scss
  css:
    - ./theme/styles.css
    - ./theme/itables_saas.css
  logo: /logo/logo.png
  logo_href: "https://github.com/xsx123123"
  navbar_right:
    - icon: github
      href: "https://github.com/xsx123123"
  sidebar_title: "RNA-seq Report"
  announcement: null

project:
  client: "李教授课题组 (Huazhong Agri. Univ.)"
  species: "Mus musculus (C57BL/6)"
  genome_version: "GRCm39 (Ensembl v109)"
  pipeline_version: "RNAFlow_v0.1.6"
  analysis_date: "2026-01-13"

stats:
  total_samples: 12
  group_count: 4

input_files:
  data_dir: /data/index/
  qc_file: /data/index/multiqc_qc_general_stats.txt
  mapping_file: /data/index/multiqc_mapping_general_stats.txt
  tpm_file: /data/index/merge_rsem_tpm.tsv
  sample_file: /data/index/sample.csv
  fastp_report_dir: /data/fastp_trim_report/multiqc_short_read_trim_report_data
  fastp_stats_file: /data/fastp_trim_report/multiqc_general_stats.txt
  fastq_screen_r1_dir: /data/fastq_screen_report/fastq_screen_multiqc_r1/multiqc_r1_fastq_screen_report_data
  fastq_screen_r2_dir: /data/fastq_screen_report/fastq_screen_multiqc_r2/multiqc_r2_fastq_screen_report_data
  qualimap_dir: /data/QualiMap/multiqc_data/
  contrasts_file: /data/index/contrasts.csv
  deg_dir: /data/res/DEG
  enrichment_dir: /data/res/Enrichments

analysis:
  deg:
    log2fc_threshold: 1.0
    pvalue_threshold: 0.05
  enrichment:
    p_cutoff: 0.1
    top_n: 20
  heatmap:
    top_n: 1000

ai:
  enabled: false
