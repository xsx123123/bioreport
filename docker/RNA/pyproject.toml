[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rnareport"
version = "1.1.0"
description = "RNA-seq interactive report generator based on Quarto"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Zhang Jian"}
]
keywords = ["rna-seq", "bioinformatics", "quarto", "report"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "pyyaml",
    "jinja2",
    "pydantic",
    "plotly",
    "matplotlib",
    "plotnine",
    "kaleido",
    "itables",
    "loguru",
    "rich",
    "rich-argparse",
    "rich-click",
    "tqdm",
    "openai",
    "tiktoken",
    "tenacity",
    "python-dateutil",
    "pytz",
    "requests",
    "beautifulsoup4",
    "lxml",
    "ipython",
    "ipykernel",
    "jupyter",
    "jupyterlab",
    "nbconvert",
    "nbformat",
    "multiqc",
]

[project.optional-dependencies]
ai = [
    "volcenginesdkarkruntime",
]
dev = [
    "pytest",
    "black",
    "ruff",
]

[project.scripts]
rnareport = "rnareport.cli:main"

[project.urls]
Homepage = "https://github.com/xsx123123/bioreport"
Repository = "https://github.com/xsx123123/bioreport"

[tool.setuptools.packages.find]
where = ["."]
include = ["rnareport*"]

[tool.setuptools.package-data]
rnareport = ["utils/prompt.txt"]
