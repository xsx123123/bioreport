<script>
(() => {
  function initializeReportPages() {
    for (const header of document.querySelectorAll('.callout-header[data-bs-toggle="collapse"]')) {
      header.setAttribute('role', 'button');
      header.setAttribute('tabindex', '0');
      header.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          header.click();
        }
      });
    }
    const labelNativeThemeControls = () => {
      // Quarto's citation hover wrapper is a <sup> around a real bibliography
      // link. Keep hover on the wrapper and add focus on the link; the wrapper
      // itself has no expanded state in the accessibility tree.
      for (const reference of document.querySelectorAll('.citation > sup')) {
        const link = reference.querySelector('a[role="doc-biblioref"]');
        if (reference._tippy && link) {
          reference._tippy.setProps({
            aria: {...reference._tippy.props.aria, expanded: false},
            triggerTarget: [reference, link]
          });
        }
        reference.removeAttribute('aria-expanded');
      }
      for (const control of document.querySelectorAll('.quarto-color-scheme-toggle')) {
        control.setAttribute('aria-label', 'Toggle color scheme');
      }
    };
    labelNativeThemeControls();
    window.addEventListener('load', labelNativeThemeControls);
    const pages = Array.from(document.querySelectorAll('.report-page'));
    const links = Array.from(document.querySelectorAll('.report-navbar a.nav-link'));
    const navbar = document.querySelector('.report-navbar');
    const toggle = navbar && navbar.querySelector ? navbar.querySelector('.report-nav-toggle') : null;
    const homeLink = navbar && navbar.querySelector ? navbar.querySelector('.report-brand a.report-brand-link') : null;
    const languageButton = document.querySelector('.report-navbar [data-report-language]');
    const themeButton = document.querySelector('.report-navbar button[data-report-theme]');
    function setLanguage(language) {
      const edition = window.BIOREPORT_LANGUAGE_EDITION;
      const target = languageButton?.querySelector('[data-language-target]')?.dataset.languageTarget;
      if (edition && target && language !== edition) {
        try { localStorage.setItem('bioreport.report-language', language); } catch (_) {}
        location.href = target + location.hash;
      }
    }
    function setTheme(theme, remember = false) {
      const dark = theme === 'dark';
      document.documentElement.dataset.reportTheme = dark ? 'dark' : 'light';
      document.documentElement.dataset.bsTheme = dark ? 'dark' : 'light';
      document.body.dataset.mode = dark ? 'dark' : 'light';
      if (themeButton) {
        const english = (window.BIOREPORT_LANGUAGE_EDITION || document.documentElement.lang).startsWith('en');
        const label = english ? (dark ? 'Switch to light mode' : 'Switch to dark mode') : (dark ? '切换到浅色模式' : '切换到深色模式');
        themeButton.setAttribute('aria-pressed', String(dark));
        themeButton.setAttribute('aria-label', label);
        themeButton.title = label;
        themeButton.querySelector('.report-theme-icon-dark')?.toggleAttribute('hidden', dark);
        themeButton.querySelector('.report-theme-icon-light')?.toggleAttribute('hidden', !dark);
      }
      if (remember) {
        try { localStorage.setItem('bioreport.report-theme', dark ? 'dark' : 'light'); } catch (_) {}
      }
    }
    languageButton?.addEventListener('click', event => {
      const language = event.target.closest('[data-language]')?.dataset.language;
      if (language) setLanguage(language);
    });
    themeButton?.addEventListener('click', () => {
      setTheme(document.documentElement.dataset.reportTheme === 'dark' ? 'light' : 'dark', true);
    });
    if (window.BIOREPORT_LANGUAGE_EDITION) document.documentElement.dataset.reportLanguage = window.BIOREPORT_LANGUAGE_EDITION;
    let savedTheme;
    try { savedTheme = localStorage.getItem('bioreport.report-theme'); } catch (_) {}
    setTheme(savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    function setMenuOpen(open) {
      if (!navbar || !navbar.classList) return;
      navbar.classList.toggle('report-nav-open', open);
      if (toggle) toggle.setAttribute('aria-expanded', String(open));
    }
    function sizeNavbar() {
      if (navbar) document.documentElement.style.setProperty('--report-navbar-height', `${navbar.getBoundingClientRect().height + 16}px`);
    }
    // Align the fixed navbar's inner edges with the page grid: left edge of the
    // TOC column (or content when the TOC is hidden) to the right edge of the
    // content column, so the brand and toolbar never float over empty space.
    function alignNavbar() {
      const content = document.querySelector('#quarto-document-content');
      if (!navbar || !content) return;
      const tocColumn = document.querySelector('#quarto-sidebar-toc-left') || document.querySelector('#TOC');
      const contentRect = content.getBoundingClientRect();
      const tocRect = tocColumn ? tocColumn.getBoundingClientRect() : null;
      const left = tocRect && tocRect.width ? Math.min(tocRect.left, contentRect.left) : contentRect.left;
      const root = document.documentElement.style;
      root.setProperty('--report-page-inset-left', `${Math.max(0, Math.round(left))}px`);
      root.setProperty('--report-page-inset-right', `${Math.max(0, Math.round(window.innerWidth - contentRect.right))}px`);
    }
    sizeNavbar();
    alignNavbar();
    window.addEventListener('load', alignNavbar);
    if (navbar && window.ResizeObserver) new window.ResizeObserver(sizeNavbar).observe(navbar);
    window.addEventListener('resize', () => {
      sizeNavbar();
      alignNavbar();
      if (window.innerWidth > 1279) setMenuOpen(false);
    });
    if (toggle) toggle.addEventListener('click', () => {
      setMenuOpen(!(navbar.classList && navbar.classList.contains('report-nav-open')));
    });

    // A table initialized inside a hidden Quarto tab needs its native width
    // calculation after the pane becomes visible, just like a routed page.
    document.addEventListener('shown.bs.tab', () => {
      for (const table of document.querySelectorAll('.tab-pane.active table.dataTable')) {
        if (table._reportTable) table._reportTable.columns.adjust();
      }
      window.dispatchEvent(new Event('resize'));
    });

    const toc = document.querySelector('#TOC');
    const tocTitle = toc?.querySelector('h2');
    if (tocTitle) tocTitle.textContent = (window.BIOREPORT_LANGUAGE_EDITION || document.documentElement.lang).startsWith('en') ? 'Contents' : '本页目录';
    const updateToc = () => {
      const selected = pages.length ? pages.find(page => !page.hidden) : document.querySelector('main');
      if (!selected || !toc) return;
      const headings = Array.from(selected.querySelectorAll('h2[id], h3[id], section[id] > h2, section[id] > h3')).filter(heading => heading.getClientRects().length);
      let active = headings[0];
      for (const heading of headings) if (heading.getBoundingClientRect().top <= 160) active = heading;
      for (const link of toc.querySelectorAll('a')) {
        const target = findTarget(link.hash);
        const current = Boolean(active && (target === active || target === active.parentElement));
        link.classList.toggle('report-toc-active', current);
        if (current) link.setAttribute('aria-current', 'location');
        else link.removeAttribute('aria-current');
      }
    };
    window.addEventListener('scroll', updateToc, {passive: true});
    window.addEventListener('hashchange', () => requestAnimationFrame(updateToc));
    requestAnimationFrame(updateToc);
    if (!pages.length) return;
    // Quarto renders Mermaid at window.load, when inactive pages have no size.
    // Claim these diagrams first and render only after their page becomes visible.
    const diagrams = Array.from(document.querySelectorAll('pre.mermaid-js'));
    for (const diagram of diagrams) diagram.classList.remove('mermaid-js');
    async function renderDiagrams(selected) {
      for (const diagram of diagrams) {
        if (diagram.closest('.report-page') !== selected || diagram.dataset.rendering) continue;
        diagram.dataset.rendering = 'true';
        try {
          const result = await window.mermaid.mermaidAPI.render(`report-mermaid-${diagrams.indexOf(diagram)}`, diagram.textContent);
          const container = document.createElement('div');
          container.className = 'report-mermaid-container';
          container.innerHTML = result.svg;
          const svg = container.querySelector('svg');
          svg.classList.add('report-mermaid-svg');
          svg.removeAttribute('height');
          svg.removeAttribute('width');
          if (diagram.dataset.label) container.id = `${diagram.dataset.label}-mermaid`;
          diagram.replaceWith(container);
          if (result.bindFunctions) result.bindFunctions(container);
        } catch (error) {
          delete diagram.dataset.rendering;
          console.error('Report flowchart rendering failed', error);
        }
      }
    }

    function findTarget(hash) {
      try { return document.getElementById(decodeURIComponent(hash.slice(1))); }
      catch (_) { return null; }
    }
    const defaultTitle = document.title;
    function syncDocumentTitle(selected) {
      const activeLink = links.find(link => link.getAttribute('aria-controls') === selected.id);
      const label = activeLink && typeof activeLink.textContent === 'string' ? activeLink.textContent.trim() : '';
      document.title = label || defaultTitle;
    }
    function selectPage(hash = location.hash, scroll = false) {
      const target = findTarget(hash);
      const selected = target?.closest('.report-page') || pages[0];
      for (const page of pages) {
        page.dataset.active = String(page === selected);
        page.hidden = page !== selected;
      }
      document.body.classList.add('report-routing-ready');
      const aboutActive = Boolean(selected.classList && selected.classList.contains && selected.classList.contains('about-project'));
      if (document.body.classList.toggle) document.body.classList.toggle('report-about-active', aboutActive);
      else if (aboutActive && document.body.classList.add) document.body.classList.add('report-about-active');
      for (const link of links) {
        if (link.getAttribute('aria-controls') === selected.id) link.setAttribute('aria-current', 'page');
        else link.removeAttribute('aria-current');
      }
      syncDocumentTitle(selected);
      requestAnimationFrame(updateToc);
      for (const link of document.querySelectorAll('#TOC a[data-scroll-target]')) {
        const heading = findTarget(link.getAttribute('data-scroll-target'));
        const item = link.closest('li');
        if (item) item.hidden = heading?.closest('.report-page') !== selected;
      }
      requestAnimationFrame(() => {
        renderDiagrams(selected);
        for (const chart of selected.querySelectorAll('.js-plotly-plot')) {
          if (window.Plotly && chart._fullLayout && !chart.layout?.meta?.bioreport_responsive_pca && chart.getBoundingClientRect().width > 0) window.Plotly.Plots.resize(chart);
        }
        for (const table of selected.querySelectorAll('table.dataTable')) {
          if (table._reportTable) table._reportTable.columns.adjust();
        }
        window.dispatchEvent(new Event('resize'));
        if (scroll) (target || selected).scrollIntoView({block: 'start'});
      });
    }
    // Explicitly route navbar clicks: smooth-scroll handlers may update history
    // without firing hashchange, so hashchange alone does not switch pages.
    function routeNavClick(event, link) {
      if (event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      if (location.hash !== link.hash) {
        try { history.pushState(null, '', link.hash); }
        catch (_) { location.hash = link.hash; }
      }
      selectPage(link.hash, true);
      setMenuOpen(false);
    }
    for (const link of links) link.addEventListener('click', event => routeNavClick(event, link), true);
    if (homeLink) homeLink.addEventListener('click', event => routeNavClick(event, homeLink), true);
    // Reveal a destination before Quarto handles a cross-page heading link.
    document.addEventListener('click', event => {
      const link = event.target.closest('a[href^="#"]');
      if (link && !link.closest('.report-navbar') && findTarget(link.hash)?.closest('.report-page')) {
        routeNavClick(event, link);
      }
    }, true);
    window.addEventListener('hashchange', () => selectPage(location.hash, true));
    window.addEventListener('popstate', () => selectPage(location.hash, true));
    selectPage();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initializeReportPages);
  } else initializeReportPages();
})();
</script>
