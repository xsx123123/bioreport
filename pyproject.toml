[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioreport"
version = "2.0.1"
description = "Multi-omics report generator based on Quarto"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Zhang Jian"}
]
keywords = ["rna-seq", "bioinformatics", "quarto", "report"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pyyaml",
    "jinja2",
    "jsonschema>=4.26",
    "loguru",
    "rich",
    "rich-argparse",
    "pypdf>=5",
    "fonttools[woff]>=4.58",
    "pandas",
    "numpy",
    "scipy",
    "scikit-learn",
    "plotly",
    "matplotlib",
    "plotnine",
    "kaleido>=1.0,<2",
    "itables>=2.8.2,<2.9",
    "tabulate>=0.9",
    "python-dateutil",
    "pytz",
    "requests",
    "beautifulsoup4",
    "lxml",
    "ipython",
    "ipykernel",
    "jupyter",
    "jupyterlab",
    "nbconvert",
    "nbformat",
    "multiqc",
    "openai",
    "tiktoken",
    "tenacity",
    "pydantic",
]

[project.optional-dependencies]
# Compatibility aliases: RNA and AI dependencies are installed by default.
rna = []
ai = []
security = ["pikepdf"]
validation = ["pypdfium2", "Pillow", "numpy"]
web = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = [
    "pytest",
    "black",
    "ruff",
]

[project.scripts]
bioreport = "bioreport.cli:main"

[project.urls]
Homepage = "https://github.com/xsx123123/bioreport"
Repository = "https://github.com/xsx123123/bioreport"

[tool.setuptools.packages.find]
where = ["."]
include = ["bioreport*", "omics*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.package-data]
bioreport = ["translations.en.json", "utils/prompt.txt", "report.schema.json", "assets/fonts/**/*", "assets/js/*"]
"omics.rna" = ["qmd/**/*.qmd", "qmd/assets/*.svg", "schema.json"]

[tool.setuptools.data-files]
"share/bioreport/templates" = ["templates/_quarto.yml.j2", "templates/_quarto-single.yml.j2"]
"share/bioreport/templates/shared" = [
    "templates/shared/AI.qmd",
    "templates/shared/about.qmd",
    "templates/shared/faq.qmd",
    "templates/shared/license.qmd",
    "templates/shared/provenance.qmd",
    "templates/shared/trademark.qmd",
]
"share/bioreport/templates/shared/assets" = ["templates/shared/assets/*"]
"share/bioreport/templates/theme" = ["templates/theme/*"]
"share/bioreport/templates/reference" = ["templates/reference/*"]
"share/bioreport/templates/logo" = ["templates/logo/*"]
"share/bioreport/templates/pdf" = ["templates/pdf/*.typ", "templates/pdf/*.typ.j2", "templates/pdf/*.lua"]
